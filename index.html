function useMagnetic() {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el || matchMedia('(pointer: coarse)').matches || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const move = (e) => {
      const r = el.getBoundingClientRect();
      const x = e.clientX - (r.left + r.width / 2), y = e.clientY - (r.top + r.height / 2);
      gsap.to(el, { x: x * 0.22, y: y * 0.3, duration: 0.5, ease: 'power3.out' });
    };
    const leave = () => gsap.to(el, { x: 0, y: 0, duration: 0.8, ease: 'elastic.out(1, .4)' });
    el.addEventListener('mousemove', move); el.addEventListener('mouseleave', leave);
    return () => { el.removeEventListener('mousemove', move); el.removeEventListener('mouseleave', leave); };
  }, []);
  return ref;
}

function Preloader({ onReveal, onDone }) {
  const root = useRef(null);
  useLayoutEffect(() => {
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    document.getElementById('boot')?.remove();
    const tl = gsap.timeline({ onComplete: onDone });
    tl.from('[data-pl-mark]', { clipPath: reduce ? 'inset(0 0% 0 0)' : 'inset(0 100% 0 0)', opacity: reduce ? 0 : 1, duration: reduce ? .2 : 1.1, ease: 'power2.inOut' })
      .from('[data-pl-name]', { y: 14, opacity: 0, duration: reduce ? .2 : .7, ease: 'expo.out' }, '-=.35')
      .to('[data-pl-bar]', { scaleX: 1, duration: reduce ? .2 : .8, ease: 'power2.inOut' }, '-=.4')
      .add(() => onReveal(), '+=.05')
      .to(root.current, { yPercent: -100, duration: reduce ? .3 : 1.05, ease: 'expo.inOut' }, '+=.05');
    return () => tl.kill();
  }, []);
  return (
    <div ref={root} className="fixed inset-0 z-[80] flex flex-col items-center justify-center bg-navy-950 text-cream" aria-hidden="true">
      <span data-pl-mark className="logo-mark block h-24 w-28 bg-gold-light sm:h-28 sm:w-32" />
      <div data-pl-name className="mt-6 text-center">
        <p className="font-serif text-[26px] tracking-[0.08em]">DR. DARIAN BOCCACIO</p>

    </div>
  );
}

function Treatments() {
  const track = useRef(null);
  const [idx, setIdx] = useState(0);
  const drag = useRef({ down: false, x: 0, left: 0, moved: false });

  const stepW = () => { const card = track.current.querySelector('[data-card]'); return card ? card.offsetWidth + 24 : 400; };
  useEffect(() => {
    const el = track.current;
    const on = () => setIdx(Math.min(TREATMENTS.length - 1, Math.round(el.scrollLeft / stepW())));
    el.addEventListener('scroll', on, { passive: true });
    return () => el.removeEventListener('scroll', on);
  }, []);

  const toIdx = (i) => track.current.scrollTo({ left: Math.max(0, Math.min(TREATMENTS.length - 1, i)) * stepW(), behavior: 'smooth' });
  const pd = (e) => { if (e.pointerType !== 'mouse') return; drag.current = { down: true, x: e.clientX, left: track.current.scrollLeft, moved: false }; track.current.style.scrollSnapType = 'none'; track.current.style.scrollBehavior = 'auto'; };
  const pm = (e) => { const d = drag.current; if (!d.down) return; const dx = e.clientX - d.x; if (Math.abs(dx) > 4) d.moved = true; track.current.scrollLeft = d.left - dx; };
  const pu = () => { if (!drag.current.down) return; drag.current.down = false; track.current.style.scrollSnapType = ''; track.current.style.scrollBehavior = ''; toIdx(Math.round(track.current.scrollLeft / stepW())); };
  const pad = 'max(20px, calc((100vw - 1240px) / 2 + 32px))';

  return (
    <section id="tratamentos" className="grain relative overflow-hidden bg-gradient-to-br from-navy-900 via-navy-950 to-navy-900 py-24 text-cream sm:py-32">
      <div aria-hidden="true" className="pointer-events-none absolute right-[-10%] top-[-20%] h-[700px] w-[700px] rounded-full bg-[radial-gradient(circle,rgba(35,71,107,.55),transparent_65%)]" />

/* ------------------------------------------------------------------ 5b. vídeo */
function VideoSection() {
  const ref = useRef(null);
  const [muted, setMuted] = useState(true);
  const [playing, setPlaying] = useState(false);
  useEffect(() => {
    const v = ref.current;
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const io = new IntersectionObserver(([e]) => {
      if (e.isIntersecting && !reduce && v.muted) v.play().then(() => setPlaying(true)).catch(() => {});
      if (!e.isIntersecting && !v.paused) { v.pause(); setPlaying(false); }
    }, { threshold: .45 });
    io.observe(v);
    return () => io.disconnect();
  }, []);
  const togglePlay = () => { const v = ref.current; if (v.paused) { v.play(); setPlaying(true); } else { v.pause(); setPlaying(false); } };
  const listen = () => { const v = ref.current; v.muted = !v.muted; setMuted(v.muted); if (!v.muted) { v.currentTime = 0; v.play(); setPlaying(true); } };
  return (
    <section id="video" className="relative overflow-hidden bg-sand py-24 sm:py-32">
      <div className={`${C} grid items-center gap-14 lg:grid-cols-12`}>
        <div className="lg:col-span-5">
          <Eyebrow>Em vídeo</Eyebrow>
          <Lines className="mt-4 font-serif text-[44px] font-medium leading-[1.02] tracking-[-0.02em] text-ink sm:text-[60px]" lines={['Conheça o', 'Dr. Darian', <Em>antes da consulta.</Em>]} />

          <div data-fade className="mt-10 flex flex-col gap-3 sm:flex-row sm:flex-wrap">
            <button onClick={listen} className="group inline-flex min-h-[54px] items-center justify-center gap-3 whitespace-nowrap rounded-full bg-navy-900 px-8 text-[15px] font-medium text-cream transition duration-300 hover:-translate-y-0.5 hover:bg-navy-700 active:scale-[.97]">
              {muted ? <SoundOff className="h-5 w-5" /> : <SoundOn className="h-5 w-5" />}{muted ? 'Assistir com som' : 'Desativar som'}
            </button>
            <GhostButton href={IG} light={false} external>Mais vídeos no Instagram</GhostButton>
          </div>
        </div>

        <div className="relative h-[560px] sm:h-[700px] lg:col-span-7">
          <div data-img-reveal className="absolute right-0 top-0 hidden h-[86%] w-[62%] overflow-hidden rounded-[32px] sm:block">
            <img src={PHOTOS.chandelier} alt="Dr. Darian de terno escuro em um hall com lustre" className="h-[115%] w-full object-cover object-[50%_20%]" loading="lazy" />
            <div className="absolute inset-0 bg-gradient-to-tr from-navy-950/60 via-transparent to-transparent" />
          </div>
          <div data-fade className="absolute bottom-0 left-1/2 w-[300px] -translate-x-1/2 sm:left-[6%] sm:w-[330px] sm:translate-x-0">
            <div className="relative overflow-hidden rounded-[42px] border-[8px] border-navy-950 bg-navy-950 shadow-[0_50px_100px_-30px_rgba(6,17,28,.7)]">
              <video ref={ref} src={VIDEO.src} poster={VIDEO.poster} muted loop playsInline preload="metadata" className="aspect-[9/16] w-full object-cover" aria-label="Vídeo do Dr. Darian Boccacio no consultório" />
              <span className="pointer-events-none absolute left-4 top-4 inline-flex items-center gap-2 rounded-full bg-navy-950/60 px-3 py-1.5 text-[10px] font-medium uppercase tracking-[0.2em] text-cream backdrop-blur">
                <span className={`h-1.5 w-1.5 rounded-full ${playing ? 'animate-pulse bg-red-500' : 'bg-cream/60'}`} />Dr. Darian
              </span>
              <div className="absolute inset-x-3 bottom-3 flex items-center justify-between gap-2">
                <button onClick={togglePlay} aria-label={playing ? 'Pausar vídeo' : 'Reproduzir vídeo'} className="grid h-12 w-12 place-items-center rounded-full bg-cream/90 text-navy-950 backdrop-blur transition hover:scale-105 active:scale-95">
                  {playing ? <Pause className="h-5 w-5" /> : <Play className="h-5 w-5" />}
                </button>
                <button onClick={listen} aria-label={muted ? 'Ativar som' : 'Desativar som'} className="grid h-12 w-12 place-items-center rounded-full bg-navy-950/60 text-cream backdrop-blur transition hover:scale-105 active:scale-95">
                  {muted ? <SoundOff className="h-5 w-5" /> : <SoundOn className="h-5 w-5" />}
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  );
}

/* ------------------------------------------------------------------ motion */
function useMotion(ready) {
  useLayoutEffect(() => {
    if (!ready) return;
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    gsap.registerPlugin(ScrollTrigger);

    let lenis, tick;
    if (!reduce && window.Lenis) {
      lenis = new Lenis({ lerp: 0.09 });
      window.__lenis = lenis;
      lenis.on('scroll', ScrollTrigger.update);
      tick = (t) => lenis.raf(t * 1000);
      gsap.ticker.add(tick);
      gsap.ticker.lagSmoothing(0);
    }
    // links internos com rolagem suave
    const onClick = (e) => {
      const a = e.target.closest('a[href^="#"]');
      if (!a) return;
      const target = document.querySelector(a.getAttribute('href'));
      if (!target) return;
      e.preventDefault();
      if (lenis) lenis.scrollTo(target, { offset: 0, duration: 1.4 });
      else target.scrollIntoView();
    };
    document.addEventListener('click', onClick);

    const ctx = gsap.context(() => {
      // hero: entrada
      const tl = gsap.timeline({ defaults: { ease: 'expo.out' } });
      tl.from('[data-hero-img]', { scale: reduce ? 1 : 1.25, opacity: reduce ? 0 : 1, duration: reduce ? .6 : 2.4, ease: 'power3.out' })
        .from('[data-hero-lines] .line > span', { yPercent: reduce ? 0 : 115, opacity: reduce ? 0 : 1, duration: 1.3, stagger: .12 }, .15)
        .from('[data-hero-fade]', { y: reduce ? 0 : 26, opacity: 0, duration: 1.1, stagger: .1 }, .55);
      if (!reduce) {
        gsap.to('[data-hero-parallax]', { yPercent: 12, ease: 'none', scrollTrigger: { trigger: '#inicio', start: 'top top', end: 'bottom top', scrub: true } });
      }

      // títulos: linhas sobem da máscara
      gsap.utils.toArray('[data-lines]').forEach((el) => {
        gsap.from(el.querySelectorAll('.line > span'), { yPercent: reduce ? 0 : 115, opacity: reduce ? 0 : 1, duration: 1.2, ease: 'expo.out', stagger: .1, scrollTrigger: { trigger: el, start: 'top 88%' } });
      });
      // blocos
      gsap.utils.toArray('[data-fade]').forEach((el) => {
        gsap.from(el, { y: reduce ? 0 : 34, opacity: 0, duration: 1, ease: 'power3.out', delay: parseFloat(el.dataset.delay || 0), scrollTrigger: { trigger: el, start: 'top 90%' } });
      });
      // linhas douradas
      gsap.utils.toArray('[data-draw]').forEach((el) => gsap.from(el, { scaleX: 0, duration: 1.4, ease: 'expo.out', scrollTrigger: { trigger: el, start: 'top 92%' } }));
      // fotos: cortina que abre + zoom
      gsap.utils.toArray('[data-img-reveal]').forEach((el) => {
        const im = el.querySelector('img');
        const t = gsap.timeline({ scrollTrigger: { trigger: el, start: 'top 85%' } });
        t.from(el, { clipPath: reduce ? 'inset(0% 0% 0% 0%)' : 'inset(100% 0% 0% 0%)', opacity: reduce ? 0 : 1, duration: 1.4, ease: 'expo.inOut' })
         .from(im, { scale: reduce ? 1 : 1.35, duration: 1.8, ease: 'expo.out' }, .15);
        if (!reduce) gsap.fromTo(im, { yPercent: -6 }, { yPercent: 6, ease: 'none', scrollTrigger: { trigger: el, start: 'top bottom', end: 'bottom top', scrub: true } });
      });
      // números
      gsap.utils.toArray('[data-count]').forEach((el) => {
        const end = parseFloat(el.dataset.count), dec = parseInt(el.dataset.decimals || 0, 10), o = { v: 0 };
        const fmt = (v) => dec ? v.toFixed(dec).replace('.', ',') : Math.round(v).toLocaleString('pt-BR');
        el.textContent = fmt(0);
        gsap.to(o, { v: end, duration: reduce ? .01 : 2.2, ease: 'power2.out', scrollTrigger: { trigger: el, start: 'top 90%' }, onUpdate: () => (el.textContent = fmt(o.v)) });
      });
      // etapas: linha dourada desenha com a rolagem
      const steps = document.querySelector('[data-steps]');
      if (steps) {
        gsap.fromTo('[data-steps-line]', { scaleY: 0 }, { scaleY: 1, ease: 'none', scrollTrigger: { trigger: steps, start: 'top 70%', end: 'bottom 75%', scrub: reduce ? false : .6 } });
        gsap.utils.toArray('[data-step]').forEach((el) => gsap.from(el, { x: reduce ? 0 : 40, opacity: 0, duration: 1, ease: 'expo.out', scrollTrigger: { trigger: el, start: 'top 85%' } }));
      }
      if (!reduce) {
        // colagem do esporte em velocidades diferentes
        gsap.utils.toArray('[data-speed]').forEach((el) => gsap.fromTo(el, { yPercent: -parseFloat(el.dataset.speed) }, { yPercent: parseFloat(el.dataset.speed), ease: 'none', scrollTrigger: { trigger: el.parentElement, start: 'top bottom', end: 'bottom top', scrub: true } }));
        // faixa: inclina com a velocidade da rolagem
        const skew = document.querySelector('[data-skew]');
        if (skew) {
          const set = gsap.quickTo(skew, 'skewX', { duration: .6, ease: 'power3.out' });
          ScrollTrigger.create({ onUpdate: (s) => set(gsap.utils.clamp(-10, 10, s.getVelocity() / -300)) });
        }
      }
    });
    const refresh = () => ScrollTrigger.refresh();
    requestAnimationFrame(refresh);
    window.addEventListener('load', refresh);
    return () => { ctx.revert(); document.removeEventListener('click', onClick); window.removeEventListener('load', refresh); if (lenis) { gsap.ticker.remove(tick); lenis.destroy(); } window.__lenis = null; };
  }, [ready]);
}
